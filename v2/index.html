<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<meta name="robots" content="noindex">
<title>הכסף שלי · אב־טיפוס v2</title>

</head>
<body>
<a class="skip" href="#main">דלג לתוכן</a>
<div class="shell">

  <div style="flex:1;min-width:0">
    <header id="appbar" class="appbar"></header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="sheet" class="sheet-wrap" hidden>

  <div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div><div id="sheet-body"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">כדי להשתמש באתר צריך להפעיל JavaScript בדפדפן.</p></noscript>
