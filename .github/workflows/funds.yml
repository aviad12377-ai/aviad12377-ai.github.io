name: Update fund statistics

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 06:17/07:17 Israel time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data-commits
  cancel-in-progress: false

jobs:
  fetch-funds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch gemelnet / pensianet / bituachnet from data.gov.il
        run: python3 scripts/fetch_funds.py funds.json

      - name: Commit funds.json if changed
        run: |
          bash scripts/commit_data.sh "chore: update funds.json" funds.json
