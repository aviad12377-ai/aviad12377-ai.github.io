name: Update prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repo-data-commits
  cancel-in-progress: false

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Yahoo quotes
        run: python3 scripts/fetch_prices.py

      - name: Refresh TASE securities lookup
        run: python3 scripts/fetch_tase_securities.py

      - name: Refresh Funder fund and ETF lists
        continue-on-error: true   # Funder may block runner IPs; prices still commit
        timeout-minutes: 3
        run: python3 scripts/fetch_funder_list.py

      - name: Fetch Israeli mutual-fund NAVs (agorot -> ILS, public prices only)
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/fetch_fund_nav.py

      - name: Commit prices and TASE lookup if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json tase_securities.json
          if git diff --cached --quiet; then
            echo "No price or lookup changes"
          else
            git commit -m "chore: update prices.json and tase_securities.json"
            git pull --rebase origin main
            git push
          fi
