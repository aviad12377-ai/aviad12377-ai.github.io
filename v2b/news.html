<script>document.addEventListener('v2:ready',function(){

var N, kind = 'all', shown = 20;
function card(i) {
  var tag = i.kind === 'digest' ? (i.edition || 'סקירה') : i.kind === 'funds' ? 'קרנות' : (i.source || 'חדשות');
  var stories = (i.stories || []).map(function (s) { return '<div class="story"><h4>' + V2.esc(s.title) + '</h4><p>' + V2.esc(s.text) + '</p></div>'; }).join('');
  var link = (i.links && i.links[0]) ? '<a class="link" href="' + V2.esc(i.links[0].url) + '" target="_blank" rel="noopener">לכתבה המלאה ›</a>' : '';
  return '<article class="card" id="' + V2.esc(i.id) + '"' + (i.lang === 'en' ? ' lang="en" dir="ltr"' : '') + '><div class="brief-meta" dir="rtl"><span class="tag' + (i.kind === 'digest' ? ' good' : '') + '">' + V2.esc(tag) + '</span><span>' + V2.when(i.time) + '</span></div><h2 class="brief-t">' + V2.esc(i.title) + '</h2><p class="brief-s" style="-webkit-line-clamp:' + (stories ? 4 : 3) + '">' + V2.esc(i.summary || '') + '</p>' +
    (stories ? '<details class="more-d" dir="rtl"><summary>כל הסיפורים (' + i.stories.length + ')</summary>' + stories + '</details>' : '') + link + '</article>';
}
function render() {
  var L = N.items.filter(function (i) { return kind === 'all' || i.kind === kind; }).sort(function (a, b) { return a.time < b.time ? 1 : -1; });
  document.getElementById('feed').innerHTML = L.length ? L.slice(0, shown).map(card).join('') + (L.length > shown ? '<button class="btn btn-block" id="more" type="button">עוד ידיעות</button>' : '') : '<div class="empty"><h3>אין ידיעות כרגע</h3><p>הסקירה הבאה תגיע בפתיחת המסחר.</p></div>';
  var m = document.getElementById('more'); if (m) m.addEventListener('click', function () { shown += 20; render(); });
}
V2.chips(document.getElementById('f'), function (v) { kind = v; shown = 20; render(); window.scrollTo({ top: 0 }); });
V2.data('../data/news.json').then(function (n) {
  N = n; render();
  if (location.hash) { var el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) { el.scrollIntoView({ block: 'start' }); var d = el.querySelector('details'); if (d) d.open = true; } }
});

});</script>
