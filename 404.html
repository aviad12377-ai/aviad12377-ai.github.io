<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>העמוד לא נמצא · הכסף שלי</title>

<style>
:root{--bg:#F4F2EE;--surface:#fff;--ink:#0E1726;--muted:#5A6373;--line:#E3DFD7;--primary:#1B3A6B;--on:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#090D14;--surface:#111722;--ink:#EEF2F7;--muted:#A3ADBD;--line:#232C3B;--primary:#9CC2FF;--on:#08111F}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Heebo,Arial,sans-serif}
main{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
h1{font-size:24px;margin:0 0 8px}
p{margin:0 0 20px;color:var(--muted)}
a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;font-weight:700;text-decoration:none;margin-top:10px}
a.pri{background:var(--primary);color:var(--on)}
a.sec{color:var(--primary);border:1px solid var(--line)}
a:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>העמוד לא נמצא</h1>
